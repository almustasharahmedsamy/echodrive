name: Windows build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Stage runtime audio assets
        shell: bash
        run: |
          mkdir -p release/assets
          cp build/Release/echodrive.exe release/echodrive.exe
          cp -r assets/audio release/assets/audio
      - name: Package
        run: Compress-Archive -Path release/* -DestinationPath EchoDrive-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EchoDrive-Windows-x64
          path: EchoDrive-Windows-x64.zip
